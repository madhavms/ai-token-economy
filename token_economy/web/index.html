<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Economy</title>
<style>
:root{
  color-scheme:light;
  --page:#f4f4f1; --side:#f9f9f7; --card:#fcfcfb; --raise:#ffffff; --wash:#f0efec;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6e69; --faint:#898781;
  --grid:#e1e0d9; --base:#c3c2b7; --ring:rgba(11,11,11,.10); --ring2:rgba(11,11,11,.16);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s0:#a9a8a1;
  --good:#0ca30c; --goodtext:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --crittext:#b42d2d;
  --accent:#2a78d6; --accentwash:rgba(42,120,214,.10);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --side:#121211; --card:#1a1a19; --raise:#222220; --wash:#262624;
    --ink:#f0efec; --ink2:#c3c2b7; --muted:#a3a29a; --faint:#898781;
    --grid:#2c2c2a; --base:#383835; --ring:rgba(255,255,255,.10); --ring2:rgba(255,255,255,.16);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s0:#5d5c57;
    --goodtext:#0ca30c; --crittext:#e66767; --accent:#3987e5; --accentwash:rgba(57,135,229,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --side:#121211; --card:#1a1a19; --raise:#222220; --wash:#262624;
  --ink:#f0efec; --ink2:#c3c2b7; --muted:#a3a29a; --faint:#898781;
  --grid:#2c2c2a; --base:#383835; --ring:rgba(255,255,255,.10); --ring2:rgba(255,255,255,.16);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s0:#5d5c57;
  --goodtext:#0ca30c; --crittext:#e66767; --accent:#3987e5; --accentwash:rgba(57,135,229,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
/* sidebar */
aside{background:var(--side);border-right:1px solid var(--ring);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand .mark svg{width:16px;height:16px}
.brand b{font-size:14px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink2);font-weight:500}
.nav a:hover{background:var(--wash);text-decoration:none}
.nav a[aria-current="page"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 8px;line-height:1.5}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ring)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px}
.top h1{font-size:17px;margin:0;letter-spacing:-.01em;font-weight:650}
.crumbs{color:var(--muted);font-size:13px}
.grow{flex:1}
.seg{display:inline-flex;background:var(--wash);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.06)}
#f-project{max-width:240px}
select,input[type=text],input[type=number],input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--raise);border:1px solid var(--ring2);border-radius:7px;padding:5px 9px;min-height:32px}
.btn{border:1px solid var(--ring2);background:var(--raise);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:500;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.updated{font-size:12px;color:var(--muted)}
main{padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px;max-width:1440px;transition:opacity .15s}
main.busy{opacity:.55;pointer-events:none}
/* cards */
.row{display:grid;gap:18px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:1180px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c3,.c32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.side-foot{display:none}.c2{grid-template-columns:1fr}.top-in,main{padding-left:16px;padding-right:16px}}
@media (max-width:560px){.c4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 0}
.card-h h2{font-size:13.5px;margin:0;font-weight:620;letter-spacing:-.005em}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:12px 16px 16px}
.card-b.flush{padding:8px 0 4px}
.mini{font-size:11.5px}
.mini.seg button{padding:3px 8px;font-size:11.5px;min-height:24px}
/* stat tiles */
.tile{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.tile .lab{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .val{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.tile .val small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:4px}
.tile .foot{font-size:12.5px;color:var(--ink2)}
.delta{font-weight:600}
.delta.bad{color:var(--crittext)} .delta.good{color:var(--goodtext)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--wash);margin:4px 0 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.meter i.over{background:var(--crit)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;background:var(--wash);color:var(--ink)}
.status svg{width:13px;height:13px}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11px var(--sans);fill:var(--faint)}
.chart .lbl{fill:var(--ink2);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);padding:0 16px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.legend i.ln{height:2px;width:14px;border-radius:1px}
.legend i.dash{height:0;width:14px;border-top:2px dashed var(--s1);background:none}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--raise);color:var(--ink);border:1px solid var(--ring2);box-shadow:0 8px 24px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;max-width:340px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip .t{color:var(--muted);margin-bottom:4px;font-size:11.5px}
#tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:1px 0}
#tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
#tip .r i{display:inline-block;width:12px;height:2px;border-radius:1px}
#tip .r b{font-variant-numeric:tabular-nums;font-weight:650}
#tip .n{color:var(--ink2);margin-top:4px;font-size:11.5px;max-width:320px}
/* horizontal bars */
.hb{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(48px,1fr) 70px 42px;align-items:center;gap:4px 12px;padding:5px 16px;border-radius:6px}
.hb:hover{background:var(--wash)}
.hb .l{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{height:10px;position:relative}
.hb .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.hb .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;font-size:11.5px;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--ring);white-space:nowrap;position:sticky;top:0;background:var(--card)}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)}
th .arr{opacity:.6;margin-left:3px}
td{padding:8px 12px;border-bottom:1px solid var(--ring);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--wash)}
td .t1{font-weight:550;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .t2{font-size:12px;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share i{display:block;height:6px;border-radius:3px;background:var(--s1);opacity:.85}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--wash);color:var(--ink2);margin:0 4px 2px 0;white-space:nowrap}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
/* findings */
.levers{display:flex;flex-direction:column}
.lever{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:12px 16px;border-top:1px solid var(--ring)}
.lever:first-child{border-top:0}
.lever .h{font-weight:600;font-size:13.5px}
.lever .d{grid-column:1/-1;color:var(--ink2);font-size:13px}
.lever .f{grid-column:1/-1;font-size:12.5px;color:var(--ink);display:flex;gap:6px}
.lever .f svg{flex:none;width:14px;height:14px;margin-top:2px;stroke:var(--goodtext);fill:none;stroke-width:2}
.lever .amt{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.lever .amt small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.headline{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.headline .ic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accentwash);display:grid;place-items:center}
.headline .ic svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8}
.headline h3{margin:0 0 3px;font-size:15px}
.headline p{margin:0;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}
.kv span{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
code,pre{font-family:var(--mono);font-size:12px}
code{background:var(--wash);padding:1px 5px;border-radius:4px}
pre{background:var(--wash);padding:10px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.check{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,2fr);gap:12px;padding:11px 16px;border-top:1px solid var(--ring);align-items:start}
.check:first-child{border-top:0}
.check .ic svg{width:16px;height:16px}
.check b{font-weight:600}
.check .why{color:var(--ink2);font-size:13px}
.search{min-width:240px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--page);padding:10px 14px;border-radius:8px;max-width:440px;z-index:60;font-size:13px}
.copy{cursor:pointer}
.pill-crit{color:var(--crittext);font-weight:600}
.skel{color:var(--muted);padding:60px 0;text-align:center}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0}
.split i{display:block;height:100%}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:10px 16px}
.q{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--ring)}
.q:first-child{border-top:0}
.range{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:4px 0}
input[type=range]{accent-color:var(--accent);width:100%}
.lane{border-left:3px solid var(--accent);padding:10px 14px;background:var(--wash);border-radius:6px}
.small-caps{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="mark"><svg viewBox="0 0 16 16"><path d="M2 12 L6 7 L9 9.5 L14 3" stroke="var(--page)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Token Economy</b><small>AI coding spend</small></div></div>
    <nav class="nav" aria-label="Views">
      <a href="#/overview" data-v="overview"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Overview</a>
      <a href="#/sessions" data-v="sessions"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Sessions</a>
      <a href="#/causes" data-v="causes"><svg viewBox="0 0 16 16"><path d="M2 3h9M2 6.5h12M2 10h6M2 13.5h4"/></svg>Causes</a>
      <a href="#/subagents" data-v="subagents"><svg viewBox="0 0 16 16"><circle cx="8" cy="4" r="2"/><circle cx="3.5" cy="12" r="2"/><circle cx="12.5" cy="12" r="2"/><path d="M7 5.7 4.5 10.3M9 5.7l2.5 4.6"/></svg>Subagents</a>
      <a href="#/setup" data-v="setup"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Setup</a>
      <a href="#/planner" data-v="planner"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 6h6M5 8.5h6M5 11h3"/></svg>Planner</a>
    </nav>
    <div class="side-foot"><div class="seg mini" id="theme" role="group" aria-label="Theme" style="margin-bottom:10px"><button data-t="auto">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div><div><span class="dot"></span>Local only · no tokens spent</div><div id="foot-ver"></div><div id="foot-prices"></div></div>
  </aside>
  <div>
    <div class="top"><div class="top-in">
      <div><h1 id="title">Overview</h1><div class="crumbs" id="crumbs"></div></div>
      <span class="grow"></span>
      <div class="seg" id="f-tool" role="group" aria-label="Tool"><button data-k="claude">Claude Code</button><button data-k="codex">Codex</button></div>
      <div class="seg" id="f-period" role="group" aria-label="Period">
        <button data-k="today">Today</button><button data-k="week">This week</button><button data-k="7d">7 days</button>
        <button data-k="month">This month</button><button data-k="30d">30 days</button><button data-k="lastmonth">Last month</button></div>
      <select id="f-project" aria-label="Project"><option value="">All projects</option></select>
      <button class="btn" id="refresh" title="Re-read the logs"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Refresh</button>
      <span class="updated" id="updated"></span>
    </div></div>
    <main id="app"><div class="skel">Reading your Claude Code and Codex logs…</div></main>
  </div>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
const TOKEN = "__TKE_TOKEN__";
const $ = s => document.querySelector(s);
const app = $("#app");
const st = {view: "overview", tool: "claude", period: "month", project: "", data: null, at: 0, sess: null, sortS: ["period_cost", -1], q: ""};
try { const saved = JSON.parse(localStorage.getItem("tke-ui") || "{}"); Object.assign(st, {tool: saved.tool || st.tool, period: saved.period || st.period}); } catch (e) {}
const save = () => { try { localStorage.setItem("tke-ui", JSON.stringify({tool: st.tool, period: st.period})); } catch (e) {} };

/* ------------------------------------------------------------------ format */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const U = () => st.data ? st.data.unit : "$";
function money(x, unit) {
  unit = unit || U(); x = x || 0;
  if (unit === "cr") return Math.round(x).toLocaleString() + " cr";
  if (x !== 0 && Math.abs(x) < 0.01) return "<$0.01";
  if (Math.abs(x) >= 1000) return "$" + Math.round(x).toLocaleString();
  return "$" + x.toFixed(2);
}
function moneyAxis(x, unit) {
  unit = unit || U();
  if (unit === "cr") return x >= 1000 ? (x / 1000).toFixed(x % 1000 ? 1 : 0) + "K" : String(Math.round(x));
  if (x >= 1000) return "$" + (x / 1000).toFixed(x % 1000 ? 1 : 0) + "K";
  return "$" + (x < 10 && x % 1 ? x.toFixed(1) : Math.round(x));
}
const tok = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1000 ? Math.round(n / 1000) + "K" : String(Math.round(n || 0));
const pct = (a, b) => b ? (100 * a / b >= 10 ? Math.round(100 * a / b) : (100 * a / b).toFixed(1)) + "%" : "–";
const dayLabel = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short"});
const dt = iso => iso ? new Date(iso).toLocaleString(undefined, {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "–";
const tm = iso => iso ? new Date(iso).toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"}) : "";
function dur(a, b) { if (!a || !b) return "–"; const m = Math.round((new Date(b) - new Date(a)) / 60000); const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return d ? d + "d " + h + "h" : h ? h + "h " + String(m % 60).padStart(2, "0") + "m" : m + "m"; }
const short = m => (m || "?").replace(/^claude-/, "");
function niceMax(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function ticks(max, n) { const out = []; for (let i = 0; i <= n; i++) out.push(max * i / n); return out; }
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3800); }
async function getJSON(u) { const r = await fetch(u); const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.status); return j; }
async function post(u, b) { const r = await fetch(u, {method: "POST", headers: {"Content-Type": "application/json", "X-TKE-Token": TOKEN}, body: JSON.stringify(b)}); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }

/* model colour follows the model family, never its rank */
function family(m) {
  m = (m || "").toLowerCase();
  if (/opus|sol(?!.*luna)/.test(m) && !/luna|astra/.test(m)) return 0;
  if (/sonnet|terra/.test(m)) return 1;
  if (/haiku|luna|mini/.test(m)) return 2;
  if (/fable|mythos|astra/.test(m)) return 3;
  return 4;
}
const FAM = st => st === "codex" ? ["GPT Sol", "GPT Terra", "GPT Luna", "GPT Astra", "Other"] : ["Opus", "Sonnet", "Haiku", "Fable", "Other"];
const FCOL = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s0)"];
const mcol = m => FCOL[family(m)];

/* ------------------------------------------------------------------ tooltip */
const tip = $("#tip");
function showTip(ev, title, rows, note) {
  tip.replaceChildren();
  if (title) { const t = document.createElement("div"); t.className = "t"; t.textContent = title; tip.append(t); }
  for (const r of rows || []) {
    const d = document.createElement("div"); d.className = "r";
    const s = document.createElement("span");
    if (r.c) { const i = document.createElement("i"); i.style.background = r.c; s.append(i); }
    s.append(document.createTextNode(r.k));
    const b = document.createElement("b"); b.textContent = r.v;
    d.append(s, b); tip.append(d);
  }
  if (note) { const n = document.createElement("div"); n.className = "n"; n.textContent = note; tip.append(n); }
  tip.classList.add("on");
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.classList.remove("on");

/* ------------------------------------------------------------------ chart helpers */
function card(title, sub, body, tools, extra) {
  return `<section class="card" ${extra || ""}><div class="card-h"><div><h2>${esc(title)}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${tools ? `<div class="tools">${tools}</div>` : ""}</div>${body}</section>`;
}
const viewToggle = id => `<div class="seg mini" data-toggle="${id}"><button aria-pressed="true" data-m="chart">Chart</button><button aria-pressed="false" data-m="table">Table</button></div>`;
function wire(root) {
  root.querySelectorAll("[data-toggle]").forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const box = document.getElementById(g.dataset.toggle);
    box.querySelector(".as-chart").hidden = b.dataset.m !== "chart";
    box.querySelector(".as-table").hidden = b.dataset.m !== "table";
  }));
}
function tableHTML(cols, rows) {
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.n ? "n" : ""}">${esc(c.f ? c.f(r) : r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function widthOf(id, fallback) { const el = document.getElementById(id); return Math.max(320, (el && el.clientWidth) || fallback || 800); }
function hover(svg, onMove) {
  svg.addEventListener("pointermove", onMove);
  svg.addEventListener("pointerleave", () => { hideTip(); svg.querySelectorAll(".xh").forEach(x => x.setAttribute("opacity", 0)); });
}

/* Budget burn: cumulative spend against the pace that lasts, with a projection */
function burnChart(id, d) {
  const box = document.getElementById(id); if (!box) return;
  const W = widthOf(id), H = 250, L = 52, R = 18, T = 16, B = 28;
  const now = new Date(d.now), y = now.getFullYear(), mo = now.getMonth(), nd = new Date(y, mo + 1, 0).getDate();
  const todayN = now.getDate();
  const days = [], wdTotal = d.pace.workdays_month; let wd = 0, cum = 0;
  for (let i = 1; i <= nd; i++) {
    const dd = new Date(y, mo, i), key = `${y}-${String(mo + 1).padStart(2, "0")}-${String(i).padStart(2, "0")}`;
    if (dd.getDay() % 6 !== 0) wd++;
    const v = Object.values(d.month_days[key] || {}).reduce((a, b) => a + b, 0);
    if (i <= todayN) cum += v;
    days.push({i, key, v, cum: i <= todayN ? cum : null, pace: d.pace.budget * Math.min(1, wd / wdTotal), wk: dd.getDay() % 6 === 0});
  }
  const proj = d.pace.projected, max = niceMax(Math.max(d.pace.budget, cum, proj) * 1.05);
  const x = i => L + (W - L - R) * (i - 1) / (nd - 1), yy = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (const t of ticks(max, 4)) g += `<line x1="${L}" x2="${W - R}" y1="${yy(t)}" y2="${yy(t)}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy(t) + 4}" text-anchor="end">${moneyAxis(t, d.unit)}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${yy(0)}" y2="${yy(0)}" stroke="var(--base)"/>`;
  for (const dd of days) if (dd.i === 1 || dd.i % 5 === 0 || dd.i === nd) g += `<text x="${x(dd.i)}" y="${H - 8}" text-anchor="middle">${dd.i}</text>`;
  // budget line
  g += `<line x1="${L}" x2="${W - R}" y1="${yy(d.pace.budget)}" y2="${yy(d.pace.budget)}" stroke="var(--base)"/><text class="lbl" x="${W - R}" y="${yy(d.pace.budget) - 6}" text-anchor="end">Budget ${money(d.pace.budget, d.unit)}</text>`;
  g += `<path d="${days.map((dd, k) => (k ? "L" : "M") + x(dd.i).toFixed(1) + " " + yy(dd.pace).toFixed(1)).join("")}" fill="none" stroke="var(--faint)" stroke-width="1.5"/>`;
  const act = days.filter(dd => dd.cum != null);
  g += `<path d="${act.map((dd, k) => (k ? "L" : "M") + x(dd.i).toFixed(1) + " " + yy(dd.cum).toFixed(1)).join("")} L${x(todayN).toFixed(1)} ${yy(0)} L${x(1)} ${yy(0)}Z" fill="var(--s1)" opacity=".08"/>`;
  g += `<path d="${act.map((dd, k) => (k ? "L" : "M") + x(dd.i).toFixed(1) + " " + yy(dd.cum).toFixed(1)).join("")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (todayN < nd) g += `<path d="M${x(todayN)} ${yy(cum)} L${x(nd)} ${yy(proj)}" stroke="var(--s1)" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity=".75"/><circle cx="${x(nd)}" cy="${yy(proj)}" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/><text class="lbl" x="${x(nd) - 8}" y="${yy(proj) + (proj > d.pace.budget ? -10 : 16)}" text-anchor="end">Projected ${money(proj, d.unit)}</text>`;
  g += `<circle cx="${x(todayN)}" cy="${yy(cum)}" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>`;
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink2)" stroke-width="1" opacity="0"/><circle class="xh" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2" opacity="0"/>`;
  const rows = days.map(dd => ({day: dd.key, spend: dd.v, cum: dd.cum, pace: dd.pace}));
  box.querySelector(".as-chart").innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Cumulative spend this month against the budget pace">${g}</svg></div>`;
  box.querySelector(".as-table").innerHTML = tableHTML([{h: "Day", k: "day"}, {h: "Spend", n: 1, f: r => money(r.spend, d.unit)}, {h: "Cumulative", n: 1, f: r => r.cum == null ? "" : money(r.cum, d.unit)}, {h: "Budget pace", n: 1, f: r => money(r.pace, d.unit)}], rows);
  const svg = box.querySelector("svg");
  hover(svg, ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(1, Math.min(nd, Math.round(1 + (px - L) / ((W - L - R) / (nd - 1))))), dd = days[i - 1];
    const [ln, dot] = svg.querySelectorAll(".xh");
    ln.setAttribute("x1", x(i)); ln.setAttribute("x2", x(i)); ln.setAttribute("opacity", .35);
    if (dd.cum != null) { dot.setAttribute("cx", x(i)); dot.setAttribute("cy", yy(dd.cum)); dot.setAttribute("opacity", 1); } else dot.setAttribute("opacity", 0);
    const rows = [];
    if (dd.cum != null) rows.push({k: "Spent to date", v: money(dd.cum, d.unit), c: "var(--s1)"}, {k: "That day", v: money(dd.v, d.unit)});
    rows.push({k: "Budget pace", v: money(dd.pace, d.unit), c: "var(--faint)"});
    showTip(ev, dayLabel(dd.key) + (dd.wk ? " · weekend" : ""), rows, dd.cum != null && dd.cum > dd.pace ? "Ahead of the pace by " + money(dd.cum - dd.pace, d.unit) : "");
  });
}

/* Daily spend, stacked by model family, with the daily allowance */
function dailyChart(id, d, daysObj, from, to, allowance) {
  const box = document.getElementById(id); if (!box) return;
  const W = widthOf(id), H = 230, L = 52, R = 12, T = 14, B = 28;
  const keys = []; for (let t = new Date(from + "T12:00:00"); t <= new Date(to + "T12:00:00"); t.setDate(t.getDate() + 1)) keys.push(t.toISOString().slice(0, 10));
  const fams = [0, 1, 2, 3, 4];
  const rows = keys.map(k => { const f = [0, 0, 0, 0, 0]; for (const [m, v] of Object.entries(daysObj[k] || {})) f[family(m)] += v; return {k, f, t: f.reduce((a, b) => a + b, 0)}; });
  const used = fams.filter(fi => rows.some(r => r.f[fi] > 0));
  const max = niceMax(Math.max(allowance || 0, ...rows.map(r => r.t)) * 1.08 || 1);
  const n = rows.length, band = (W - L - R) / n, bw = Math.min(24, Math.max(3, band * .62));
  const yy = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (const t of ticks(max, 4)) g += `<line x1="${L}" x2="${W - R}" y1="${yy(t)}" y2="${yy(t)}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy(t) + 4}" text-anchor="end">${moneyAxis(t, d.unit)}</text>`;
  const every = n > 45 ? 7 : n > 20 ? 3 : n > 10 ? 2 : 1;
  rows.forEach((r, i) => {
    const cx = L + band * i + band / 2;
    let base = 0;
    const segs = used.filter(fi => r.f[fi] > 0);
    segs.forEach((fi, k) => {
      const v = r.f[fi], y0 = yy(base), y1 = yy(base + v), top = k === segs.length - 1;
      const h = Math.max(0, y0 - y1 - (k ? 2 : 0));
      if (h > 0) g += top ? `<path d="M${cx - bw / 2} ${y0 - (k ? 2 : 0)} V${y1 + Math.min(4, h)} Q${cx - bw / 2} ${y1} ${cx - bw / 2 + Math.min(4, h)} ${y1} H${cx + bw / 2 - Math.min(4, h)} Q${cx + bw / 2} ${y1} ${cx + bw / 2} ${y1 + Math.min(4, h)} V${y0 - (k ? 2 : 0)} Z" fill="${FCOL[fi]}"/>`
                        : `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${h}" fill="${FCOL[fi]}"/>`;
      base += v;
    });
    g += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>`;
    if (i % every === 0) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${new Date(r.k + "T12:00:00").getDate()}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${yy(0)}" y2="${yy(0)}" stroke="var(--base)"/>`;
  if (allowance) g += `<line x1="${L}" x2="${W - R}" y1="${yy(allowance)}" y2="${yy(allowance)}" stroke="var(--ink2)" stroke-width="1"/><text class="lbl" x="${W - R}" y="${yy(allowance) - 6}" text-anchor="end">Daily allowance ${money(allowance, d.unit)}</text>`;
  box.querySelector(".as-chart").innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Spend per day by model">${g}</svg></div>
    <div class="legend">${used.map(fi => `<span><i style="background:${FCOL[fi]}"></i>${FAM(st.tool)[fi]}</span>`).join("")}${allowance ? `<span><i class="ln" style="background:var(--ink2)"></i>Daily allowance</span>` : ""}</div>`;
  box.querySelector(".as-table").innerHTML = tableHTML([{h: "Day", k: "k"}].concat(used.map(fi => ({h: FAM(st.tool)[fi], n: 1, f: r => money(r.f[fi], d.unit)}))).concat([{h: "Total", n: 1, f: r => money(r.t, d.unit)}]), rows);
  const svg = box.querySelector("svg");
  svg.querySelectorAll(".hit").forEach(h => {
    const r = rows[+h.dataset.i];
    const on = ev => showTip(ev, dayLabel(r.k), [{k: "Total", v: money(r.t, d.unit)}].concat(used.filter(fi => r.f[fi] > 0).map(fi => ({k: FAM(st.tool)[fi], v: money(r.f[fi], d.unit), c: FCOL[fi]}))),
      allowance && r.t > allowance ? (r.t / allowance).toFixed(1) + "× the daily allowance" : "");
    h.addEventListener("pointermove", on); h.addEventListener("pointerleave", hideTip);
  });
}

/* Horizontal bars (one series, so one colour); value at the tip, share beside it */
function fold(rows, total, minShare, label) {
  const big = rows.filter(r => r.cost >= total * minShare), small = rows.filter(r => r.cost < total * minShare);
  if (small.length > 1) big.push({label: label || "Smaller causes", cost: small.reduce((a, r) => a + r.cost, 0), fix: small.map(r => r.label).join(", ")});
  else big.push(...small);
  return big;
}
function hbars(rows, total, unit, opts) {
  opts = opts || {};
  if (!rows.length) return `<div class="empty">Nothing in this period.</div>`;
  const max = Math.max(...rows.map(r => r.cost)) || 1;
  return rows.map((r, i) => `<div class="hb" ${opts.click ? `data-click="${esc(opts.click(r))}" style="cursor:pointer"` : ""} data-tip="${i}" tabindex="0">
    <div class="l" title="${esc(r.label)}">${opts.dot ? `<span class="mdot" style="background:${opts.dot(r)}"></span>` : ""}${esc(r.label)}</div>
    <div class="track"><i style="width:${(100 * r.cost / max).toFixed(2)}%;${opts.color ? "background:" + opts.color(r) : ""}"></i></div>
    <div class="v">${money(r.cost, unit)}</div><div class="p">${pct(r.cost, total)}</div></div>`).join("");
}
function hbarTips(root, rows, unit, total, noteFn) {
  root.querySelectorAll(".hb[data-tip]").forEach(el => {
    const r = rows[+el.dataset.tip];
    const on = ev => showTip(ev, r.label, [{k: "Cost", v: money(r.cost, unit)}, {k: "Share", v: pct(r.cost, total)}].concat(r.extra || []), noteFn ? noteFn(r) : r.fix || "");
    el.addEventListener("pointermove", on); el.addEventListener("pointerleave", hideTip);
  });
}

/* ------------------------------------------------------------------ data */
async function load(refresh) {
  app.classList.add("busy");
  try {
    const q = `period=${st.period}&tool=${st.tool}${st.project ? "&project=" + encodeURIComponent(st.project) : ""}${refresh ? "&refresh=1" : ""}`;
    st.data = await getJSON("/api/overview?" + q); st.at = Date.now();
    $("#foot-ver").textContent = "tke " + st.data.version;
    $("#foot-prices").textContent = "List prices as of " + st.data.prices_date;
    const sel = $("#f-project");
    sel.innerHTML = `<option value="">All projects</option>` + st.data.projects.map(p => `<option ${p === st.project ? "selected" : ""}>${esc(p)}</option>`).join("");
  } catch (e) { app.innerHTML = `<div class="card empty">Could not read the logs: ${esc(e.message)}</div>`; app.classList.remove("busy"); return; }
  app.classList.remove("busy");
  render();
}
setInterval(() => { if (st.at) $("#updated").textContent = "Updated " + Math.max(0, Math.round((Date.now() - st.at) / 60000)) + "m ago"; }, 15000);

function syncControls() {
  document.querySelectorAll("#f-tool button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === st.tool));
  document.querySelectorAll("#f-period button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === st.period));
  document.querySelectorAll(".nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === (st.view === "session" ? "sessions" : st.view) ? "page" : "false"));
  $("#updated").textContent = st.at ? "Updated just now" : "";
}
const PERIOD = {today: "Today", week: "This week", "7d": "Last 7 days", month: "This month", "30d": "Last 30 days", lastmonth: "Last month"};

function render() {
  syncControls(); hideTip();
  const v = st.view;
  $("#title").textContent = {overview: "Overview", sessions: "Sessions", session: "Session", causes: "Causes", subagents: "Subagents", setup: "Setup", planner: "Planner"}[v];
  $("#crumbs").textContent = st.data && ["overview", "sessions", "causes"].includes(v) ? `${st.tool === "claude" ? "Claude Code" : "Codex"} · ${PERIOD[st.period]} · ${dayLabel(st.data.since)} – ${dayLabel(st.data.until)}${st.project ? " · " + st.project : ""}` : "";
  ({overview: vOverview, sessions: vSessions, session: vSession, causes: vCauses, subagents: vSubagents, setup: vSetup, planner: vPlanner})[v]();
}

/* ------------------------------------------------------------------ overview */
const ICON = {
  up: `<svg viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
  ok: `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--good)"/><path d="M5 8.2 7 10l4-4" stroke="#fff" stroke-width="1.8" fill="none"/></svg>`,
  warn: `<svg viewBox="0 0 16 16"><path d="M8 1.5 15 14H1z" fill="var(--warn)"/><path d="M8 6v3.5M8 11.5v.5" stroke="#1a1a19" stroke-width="1.6"/></svg>`,
  crit: `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--crit)"/><path d="M8 4.5v4.5M8 11v.5" stroke="#fff" stroke-width="1.8"/></svg>`,
  fix: `<svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4"/></svg>`,
  bolt: `<svg viewBox="0 0 16 16"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg>`,
};
function status(level, text) { return `<span class="status">${ICON[level]}${esc(text)}</span>`; }

function tiles(d) {
  const p = d.pace, u = d.unit, used = p.budget ? p.spent / p.budget : 0, exp = p.budget ? p.expected_by_now / p.budget : 0;
  const over = p.spent > p.budget, ratio = p.ratio;
  const lvl = over || ratio > 1.4 ? "crit" : ratio > 1.05 ? "warn" : "ok";
  const st1 = over ? status("crit", "Over budget") : ratio > 1.05 ? status(lvl, ratio.toFixed(1) + "× sustainable pace") : status("ok", "On pace");
  const projDelta = p.projected - p.budget;
  const lm = p.last_month;
  const todayR = p.per_workday ? p.today / p.per_workday : 0;
  const runout = over ? "Already over" : p.runout && ratio > 1 ? dayLabel(p.runout) : "Lasts the month";
  return `<div class="row c4">
    <section class="card tile"><div class="lab">Spent this month ${st1}</div>
      <div class="val">${money(p.spent, u)}<small>of ${money(p.budget, u)}</small></div>
      <div class="meter" title="Bar: spent. Mark: where spending should be by today."><i class="${over ? "over" : ""}" style="width:${Math.min(100, 100 * used).toFixed(1)}%"></i><b style="left:${Math.min(100, 100 * exp).toFixed(1)}%"></b></div>
      <div class="foot">${pct(p.spent, p.budget)} of budget · should be ${pct(p.expected_by_now, p.budget)} by today</div></section>
    <section class="card tile"><div class="lab">Projected month-end</div>
      <div class="val">${money(p.projected, u)}</div>
      <div class="foot"><span class="delta ${projDelta > 0 ? "bad" : "good"}">${projDelta > 0 ? "+" : "−"}${money(Math.abs(projDelta), u)}</span> ${projDelta > 0 ? "over" : "under"} budget at ${money(p.daily_avg, u)} a workday</div>
      <div class="foot">Last month ${money(lm, u)}</div></section>
    <section class="card tile"><div class="lab">Today</div>
      <div class="val">${money(p.today, u)}<small>of ${money(p.per_workday, u)}</small></div>
      <div class="meter"><i class="${todayR > 1 ? "over" : ""}" style="width:${Math.min(100, 100 * todayR).toFixed(1)}%"></i></div>
      <div class="foot">${todayR > 1 ? (todayR).toFixed(1) + "× the daily allowance" : money(Math.max(0, p.per_workday - p.today), u) + " left for today"}</div></section>
    <section class="card tile"><div class="lab">Budget runs out</div>
      <div class="val">${esc(runout)}</div>
      <div class="foot">${p.workdays_done} of ${p.workdays_month} workdays gone · sustainable pace ${money(p.per_workday, u)}/day</div></section>
  </div>`;
}

function leversHTML(levers, total, unit) {
  if (!levers.length) return `<div class="empty">No big lever in this period.</div>`;
  return `<div class="levers">${levers.slice(0, 6).map(l => `<div class="lever"><div class="h">${esc(l.label)}</div>
    <div class="amt">${money(l.cost, unit)}<small>${pct(l.cost, total)} of spend</small></div>
    <div class="f">${ICON.fix}<span>${esc(l.fix)}</span></div></div>`).join("")}</div>`;
}

function sessionsTable(rows, unit, limit, total, compact) {
  if (!rows.length) return `<div class="empty">No sessions in this period.</div>`;
  const max = Math.max(...rows.map(r => r.period_cost)) || 1;

  return `<div class="tw"><table><thead><tr><th class="n">Cost</th><th>Session</th><th>Main reason</th><th>Models</th><th>Started</th><th class="n">Length</th>${cols}</tr></thead><tbody>${
    rows.slice(0, limit).map(r => `<tr class="click" tabindex="0" data-sid="${esc(r.session)}" data-tool="${esc(r.tool)}">
      <td class="n"><div class="share"><i style="width:${Math.max(2, 56 * r.period_cost / max)}px"></i><b>${money(r.period_cost, unit)}</b></div>${r.period_share < .995 ? `<div class="t2" style="text-align:right">of ${money(r.cost, unit)} total</div>` : ""}</td>

      <td>${r.models.slice(0, 3).map(m => `<span class="chip"><span class="mdot" style="background:${mcol(m)}"></span>${esc(short(m))}</span>`).join("")}</td>

}

    <div class="row c32">

function ctxChart(id, R, u) {
  const box = document.getElementById(id); const W = widthOf(id), H = 260, L = 52, Rr = 16, T = 16, B = 28, n = R.length;
  if (!n) { box.querySelector(".as-chart").innerHTML = `<div class="empty">No calls.</div>`; return; }
  const max = niceMax(Math.max(160000, ...R.map(r => r.prompt)) * 1.05);
  const x = i => L + (W - L - Rr) * (n === 1 ? .5 : i / (n - 1)), yy = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (const t of ticks(max, 4)) g += `<line x1="${L}" x2="${W - Rr}" y1="${yy(t)}" y2="${yy(t)}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy(t) + 4}" text-anchor="end">${tok(t)}</text>`;
  g += `<line x1="${L}" x2="${W - Rr}" y1="${yy(0)}" y2="${yy(0)}" stroke="var(--base)"/>`;
  const every = Math.max(1, Math.ceil(n / 10 / 5) * 5);
  for (let i = 0; i < n; i += every) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`;
  R.forEach((r, i) => { if (r.compaction) g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="var(--base)" stroke-width="1.5"/>`; });
  g += `<line x1="${L}" x2="${W - Rr}" y1="${yy(150000)}" y2="${yy(150000)}" stroke="var(--ink2)"/><text class="lbl" x="${W - Rr}" y="${yy(150000) - 6}" text-anchor="end">150K</text>`;
  const pts = R.map((r, i) => x(i).toFixed(1) + " " + yy(r.prompt).toFixed(1));
  g += `<path d="M${pts.join("L")} L${x(n - 1)} ${yy(0)} L${x(0)} ${yy(0)}Z" fill="var(--s1)" opacity=".09"/>`;
  g += `<path d="M${pts.join("L")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  R.forEach((r, i) => { if (r.rebuild) g += `<circle cx="${x(i)}" cy="${yy(r.prompt)}" r="4.5" fill="var(--crit)" stroke="var(--card)" stroke-width="2"/>`; });
  g += `<line class="xh" y1="${T}" y2="${H - B}" stroke="var(--ink2)" opacity="0"/><circle class="xh" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2" opacity="0"/>`;
  box.querySelector(".as-chart").innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Context size per call">${g}</svg></div>`;
  box.querySelector(".as-table").innerHTML = `<div style="max-height:420px;overflow:auto">` + tableHTML([{h: "#", f: r => r.i + 1, n: 1}, {h: "Time", f: r => tm(r.ts)}, {h: "Model", f: r => short(r.model)}, {h: "Context", n: 1, f: r => tok(r.prompt)}, {h: "New", n: 1, f: r => tok(r.neu)}, {h: "Output", n: 1, f: r => tok(r.out)}, {h: "Cost", n: 1, f: r => money(r.cost, u)}, {h: "Notes", f: r => [r.rebuild ? "cache rebuilt after " + Math.round(r.gap / 60) + "m" : "", r.compaction ? "after compaction" : "", r.tools].filter(Boolean).join(" · ")}], R) + `</div>`;
  const svg = box.querySelector("svg");
  hover(svg, ev => {
    const rc = svg.getBoundingClientRect(), px = (ev.clientX - rc.left) * W / rc.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - Rr) / Math.max(1, n - 1))))), r = R[i];
    const [ln, dot] = svg.querySelectorAll(".xh");
    ln.setAttribute("x1", x(i)); ln.setAttribute("x2", x(i)); ln.setAttribute("opacity", .35);
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", yy(r.prompt)); dot.setAttribute("opacity", 1);
    showTip(ev, `Call ${i + 1} · ${tm(r.ts)} · ${short(r.model)}`, [{k: "Context", v: tok(r.prompt), c: "var(--s1)"}, {k: "Read from cache", v: tok(r.read)}, {k: "New this call", v: tok(r.neu)}, {k: "Output", v: tok(r.out)}, {k: "Cost", v: money(r.cost, u)}],
      [r.rebuild ? "Cache had expired after " + Math.round(r.gap / 60) + " min idle: the whole prompt was written again." : "", r.compaction ? "First call after a compaction." : "", r.tools ? "Called: " + r.tools : ""].filter(Boolean).join(" "));
  });
}

function cpcChart(id, R, u) {
  const box = document.getElementById(id); const W = widthOf(id), H = 170, L = 52, Rr = 16, T = 12, B = 26, n = R.length;
  if (!n) return;
  const max = niceMax(Math.max(...R.map(r => r.cost)) * 1.05);
  const band = (W - L - Rr) / n, bw = Math.max(1, Math.min(10, band - (band > 3 ? 1 : 0)));
  const yy = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (const t of ticks(max, 3)) g += `<line x1="${L}" x2="${W - Rr}" y1="${yy(t)}" y2="${yy(t)}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy(t) + 4}" text-anchor="end">${money(t, u)}</text>`;
  R.forEach((r, i) => { const h = Math.max(.5, yy(0) - yy(r.cost)); g += `<rect x="${(L + band * i + (band - bw) / 2).toFixed(1)}" y="${(yy(0) - h).toFixed(1)}" width="${bw.toFixed(2)}" height="${h.toFixed(1)}" fill="${r.rebuild ? "var(--crit)" : "var(--s1)"}" rx="${bw > 6 ? 2 : 0}"/>`; });
  g += `<line x1="${L}" x2="${W - Rr}" y1="${yy(0)}" y2="${yy(0)}" stroke="var(--base)"/>`;
  const every = Math.max(1, Math.ceil(n / 10 / 5) * 5);
  for (let i = 0; i < n; i += every) g += `<text x="${L + band * i + band / 2}" y="${H - 7}" text-anchor="middle">${i + 1}</text>`;
  g += `<line class="xh" y1="${T}" y2="${H - B}" stroke="var(--ink2)" opacity="0"/>`;
  box.querySelector(".as-chart").innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Cost per call">${g}</svg></div>`;
  const sorted = R.slice().sort((a, b) => b.cost - a.cost).slice(0, 50);
  box.querySelector(".as-table").innerHTML = `<p class="note" style="padding:0 16px">The 50 costliest calls.</p>` + tableHTML([{h: "#", n: 1, f: r => r.i + 1}, {h: "Time", f: r => tm(r.ts)}, {h: "Cost", n: 1, f: r => money(r.cost, u)}, {h: "Context", n: 1, f: r => tok(r.prompt)}, {h: "Rebuild", f: r => r.rebuild ? "yes" : ""}], sorted);
  const svg = box.querySelector("svg");
  hover(svg, ev => {
    const rc = svg.getBoundingClientRect(), px = (ev.clientX - rc.left) * W / rc.width;
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - L) / band))), r = R[i];
    const ln = svg.querySelector(".xh"); const cx = L + band * i + band / 2; ln.setAttribute("x1", cx); ln.setAttribute("x2", cx); ln.setAttribute("opacity", .3);
    showTip(ev, `Call ${i + 1} · ${tm(r.ts)}`, [{k: "Cost", v: money(r.cost, u), c: r.rebuild ? "var(--crit)" : "var(--s1)"}, {k: "Context", v: tok(r.prompt)}], r.rebuild ? "Cache rebuilt after a break." : "");
  });
}

/* ------------------------------------------------------------------ causes */
function vCauses() {
  const d = st.data; if (!d) return;
  const u = d.unit, tot = d.total;
  const causes = d.causes.map(c => Object.assign({}, c));
  app.innerHTML = `
    <div class="row c2">
      ${card("Causes", `${PERIOD[st.period]} · ${money(tot, u)} · every call's cost split over what was in its context`, `<div class="card-b flush" id="c-causes">${hbars(causes, tot, u)}</div>`)}
      ${card("Levers", "Dollars at stake · overlapping views across the causes", leversHTML(d.levers, tot, u))}
    </div>
    ${card("Spend per day by model", PERIOD[st.period], `<div id="pdaily"><div class="as-chart"></div><div class="as-table" hidden></div></div>`, viewToggle("pdaily"))}
    <div class="row c2">
      ${card("What each cause means", "", `<div class="levers">${causes.map(c => `<div class="lever"><div class="h">${esc(c.label)}</div><div class="amt">${money(c.cost, u)}<small>${pct(c.cost, tot)}</small></div><div class="f">${ICON.fix}<span>${esc(c.fix || "–")}</span></div></div>`).join("")}</div>`)}
      ${card("Costliest things carried in context", "Summed across sessions in the period", `<div class="card-b flush"><div class="tw"><table><thead><tr><th class="n">Cost</th><th>Item</th><th>Kind</th><th class="n">Sessions</th><th class="n">Tokens</th></tr></thead><tbody>${
        d.items.slice(0, 25).map(i => `<tr><td class="n"><b>${money(i.cost, u)}</b></td><td><div class="t1" style="max-width:340px" title="${esc(i.label)}">${esc(i.label)}</div></td><td><span class="chip">${esc(i.cat_label)}</span></td><td class="n">${i.sessions}</td><td class="n">${tok(i.tokens)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Nothing yet.</td></tr>`}</tbody></table></div></div>`)}
    </div>`;
  hbarTips($("#c-causes"), causes, u, tot);
  dailyChart("pdaily", d, d.days, d.since, d.until, null);
  wire(app);
}

/* ------------------------------------------------------------------ subagents */

  app.innerHTML = `<div class="skel">Checking agent files and subagent runs…</div>`;
  let a;
  try { a = await getJSON("/api/agents?period=" + st.period); } catch (e) { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  const s = a.summary, tot = s.lead + s.sub;
  const types = s.types.map(t => ({label: t.type, cost: t.cost, extra: [{k: "Runs", v: String(t.runs)}, {k: "Per run", v: money(t.avg, "$")}, {k: "Report", v: t.avg_report.toLocaleString() + " chars"}], fix: "Models: " + t.models.join(", ")}));
  app.innerHTML = `
    <div class="row c4">
      <section class="card tile"><div class="lab">Subagent share</div><div class="val">${pct(s.sub, tot)}</div><div class="foot">${money(s.sub, "$")} of ${money(tot, "$")} · ${PERIOD[st.period]}</div></section>
      <section class="card tile"><div class="lab">Subagent runs</div><div class="val">${s.runs.toLocaleString()}</div><div class="foot">in ${s.with_subagents} of ${s.sessions} sessions</div></section>
      <section class="card tile"><div class="lab">Complete briefs</div><div class="val">${pct(s.types.reduce((x, t) => x + t.briefs_ok, 0), s.types.reduce((x, t) => x + t.briefs, 0))}</div><div class="foot">where to look · done-when · limits · report format</div></section>
      <section class="card tile"><div class="lab">Agent files</div><div class="val">${a.setup.agents.length}</div><div class="foot">${a.setup.agents.filter(x => x.findings.some(f => f.level !== "info")).length} need changes</div></section>
    </div>
    <div class="row c32">
      ${card("Spend by subagent type", "Claude Code · " + PERIOD[st.period], `<div class="card-b flush" id="sa-types">${hbars(types, tot, "$")}</div>`)}
      ${card("What to change", "From your agent files and transcripts", a.findings.length ? `<div class="levers">${a.findings.map(f => `<div class="lever"><div class="d" style="color:var(--ink)">${esc(f.text)}</div>${f.dollars ? `<div class="amt">${money(f.dollars, "$")}</div>` : ""}</div>`).join("")}</div>` : `<div class="empty">Nothing to change.</div>`)}
    </div>
    ${card("Agent files", "User scope · run tke agents --dir <repo> or tke setup roles for a project", `<div>${a.setup.general.map(g => `<div class="check"><span class="ic">${g.level === "bad" ? ICON.crit : ICON.warn}</span><b>Settings</b><div class="why">${esc(g.text)}</div></div>`).join("")}${
      a.setup.agents.map(x => { const w = x.findings.filter(f => f.level !== "info"); return `<div class="check"><span class="ic">${w.length ? ICON.warn : ICON.ok}</span><div><b>${esc(x.name)}</b><div class="note">${esc(x.tool)} · ${esc(x.scope)} · ${esc(x.model)}</div></div><div class="why">${w.length ? w.map(f => esc(f.text)).join("<br>") : "Looks right."}</div></div>`; }).join("") || `<div class="empty">No agent files in user scope.</div>`}</div>`)}
    <div class="row c2">
      ${card("Weakest briefs", "Briefs missing two or more of the four parts", `<div class="card-b flush"><div class="tw"><table><thead><tr><th class="n">Cost</th><th>Subagent</th><th>Missing</th></tr></thead><tbody>${a.weakest.map(w => `<tr><td class="n"><b>${money(w.cost, "$")}</b></td><td><div class="t1" style="max-width:260px">${esc(w.description || w.type)}</div><div class="t2">${esc(w.type)} · ${w.brief_chars} chars</div></td><td>${w.brief_missing.map(m => `<span class="chip">${esc(m)}</span>`).join("")}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No weak briefs.</td></tr>`}</tbody></table></div></div>`)}
      ${card("The brief template", "A subagent starts with no memory; what the brief leaves out, it re-discovers", `<div class="card-b"><pre>${esc(a.template)}</pre>${a.codex.types.length ? `<div class="small-caps" style="margin-top:14px">Codex subagents</div>${a.codex.types.map(t => `<div class="q"><span>${esc(t.type)} · ${t.runs} runs · ${esc(t.models.join(", "))}</span><b>${money(t.cost, "cr")}</b></div>`).join("")}` : ""}</div>`)}
    </div>`;
  hbarTips($("#sa-types"), types, "$", tot);
}

/* ------------------------------------------------------------------ setup */
async function vSetup() {
  app.innerHTML = `<div class="skel">Checking your settings…</div>`;
  const [h, m] = await Promise.all([getJSON("/api/health"), getJSON("/api/mcp")]);
  const ok = h.checks.filter(c => c.ok).length;
  const plan = t => (h.plan[t] || []).map(x => "• " + x).join("\n");
  const rows = area => h.checks.filter(c => c.area === area).map(c => `<div class="check"><span class="ic">${c.ok ? ICON.ok : ICON.warn}</span><div><b>${esc(c.name)}</b><div class="note">${esc(c.now)}</div></div><div class="why">${esc(c.why)}${c.fix ? `<div style="margin-top:4px"><code>${esc(c.fix)}</code></div>` : ""}</div></div>`).join("");
  app.innerHTML = `
    <div class="row c2">
      ${card("Claude Code", `${h.checks.filter(c => c.area === "Claude Code" && c.ok).length} of ${h.checks.filter(c => c.area === "Claude Code").length} in good shape`, `<div>${rows("Claude Code")}</div>`)}
      ${card("Codex", `${h.checks.filter(c => c.area === "Codex" && c.ok).length} of ${h.checks.filter(c => c.area === "Codex").length} in good shape`, `<div>${rows("Codex")}</div>`)}
    </div>
    ${card("Let your agent explain its own spend", "Connect tke as an MCP server: read-only, offline, five tools (budget_status, why_session, why_period, top_sessions, subagent_audit)", `<div class="card-b">
      <div class="small-caps">One command for Claude Code, Codex and Copilot CLI</div><pre class="copy" data-copy="tke setup mcp --apply">tke setup mcp --apply</pre>
      <div class="small-caps" style="margin-top:12px">Or by hand</div><pre class="copy" data-copy="${esc(m.claude_cli)}">${esc(m.claude_cli)}</pre>
      <div class="note">${m.notes.map(esc).join("<br>")}</div>
      <div class="small-caps" style="margin-top:12px">Then ask</div><pre>Why did this session cost so much? · What drove this week's spend? · Am I on budget?</pre></div>`)}
    ${card("Apply the recommended settings", "Writes only what is missing, keeps your values, backs up every file it edits", `<div class="card-b">
      <div class="row c2"><div><b>Claude Code</b><pre>${esc(plan("claude"))}</pre></div><div><b>Codex</b><pre>${esc(plan("codex"))}</pre></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="force"> also replace values I set (model, effort)</label>
      <span class="grow"></span><button class="btn" id="ap-codex">Apply to Codex</button><button class="btn primary" id="ap-claude">Apply to Claude Code</button></div><div id="applied" class="note" style="margin-top:8px"></div></div>`)}
    ${card("Budget", "Monthly budgets used for pace and run-out dates", `<div class="card-b"><form id="budget" style="display:flex;gap:14px;flex-wrap:wrap;align-items:end">
      <label class="note">Claude ($ / month)<br><input type="number" id="b-claude" min="0" step="10" value="${st.data ? st.data.config.claude_budget_usd : ""}"></label>
      <label class="note">Codex credits / month<br><input type="number" id="b-codex" min="0" step="100" value="${st.data ? st.data.config.codex_budget_credits : ""}"></label>
      <label class="note">Workdays<br><input type="number" id="b-work" min="1" max="31" value="${st.data ? st.data.config.workdays || "" : ""}"></label>
      <button class="btn primary">Save</button></form><p class="note">Spend is estimated from local logs at list price. On a subscription it is the API-equivalent value, not your invoice.</p></div>`)}`;
  const apply = async t => {
    try { const r = await post("/api/setup", {targets: [t], force: $("#force").checked});
      $("#applied").innerHTML = r.written.length ? r.written.map(w => "Wrote " + esc(w.file) + (w.backup ? " (backup " + esc(w.backup.split(/[\\/]/).pop()) + ")" : "")).join("<br>") : "Nothing to change.";
      toast("Applied to " + t); setTimeout(vSetup, 1400); } catch (e) { toast("Not applied: " + e.message); }
  };
  $("#ap-claude").onclick = () => apply("claude"); $("#ap-codex").onclick = () => apply("codex");
  $("#budget").onsubmit = async e => { e.preventDefault();
    try { await post("/api/budget", {claude_budget_usd: +$("#b-claude").value, codex_budget_credits: +$("#b-codex").value, workdays: $("#b-work").value}); toast("Budget saved"); load(); } catch (err) { toast("Not saved: " + err.message); } };
  app.querySelectorAll("[data-copy]").forEach(c => c.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy); toast("Copied"); });
}

/* ------------------------------------------------------------------ planner */
async function vPlanner() {
  const models = await getJSON("/api/models");
  const opt = (list, sel) => list.map(m => `<option ${m === sel ? "selected" : ""}>${esc(m)}</option>`).join("");
  app.innerHTML = `<div class="row c2">
    ${card("Which model for this task?", "Three questions; the first yes wins", `<div>
      <div class="q"><span>Can a check prove it right (tests pass, lint clean, a one-line answer)?</span><input type="checkbox" id="q-check"></div>
      <div class="q"><span>Is the approach already written down (a spec or plan names the files)?</span><input type="checkbox" id="q-decided"></div>
      <div class="q"><span>Is it a design call, or a bug two attempts didn't fix?</span><input type="checkbox" id="q-hard"></div>
      <div class="card-b" id="lane"></div></div>`)}
    ${card("What will this session cost?", "Every call re-sends the whole prompt", `<div class="card-b">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px"><label class="note">Model<br><select id="e-model"><optgroup label="Claude ($)">${opt(models.claude, "claude-sonnet-5-5")}</optgroup><optgroup label="Codex (credits)">${opt(models.codex)}</optgroup></select></label>
      <label class="note">Cache<br><select id="e-ttl"><option value="1h">1 hour</option><option value="5m">5 minutes</option></select></label></div>
      <div class="range">Calls<input type="range" id="e-calls" min="5" max="400" step="5" value="60"><b id="v-calls"></b></div>
      <div class="range">Context at start (K)<input type="range" id="e-start" min="5" max="80" value="25"><b id="v-start"></b></div>
      <div class="range">Context at end (K)<input type="range" id="e-end" min="10" max="800" step="5" value="120"><b id="v-end"></b></div>
      <div class="range">Output per call<input type="range" id="e-out" min="100" max="3000" step="50" value="600"><b id="v-out"></b></div>
      <div class="range">Breaks past the cache<input type="range" id="e-breaks" min="0" max="12" value="0"><b id="v-breaks"></b></div>
      <div id="est" style="margin-top:12px"></div></div>`)}
  </div>`;
  const lane = async () => { const q = k => $("#q-" + k).checked ? 1 : 0;
    const r = await getJSON(`/api/route?check=${q("check")}&decided=${q("decided")}&hard=${q("hard")}`);
    $("#lane").innerHTML = `<div class="lane"><b>${esc(r.lane.toUpperCase())}</b> · ${esc(r.why)}<pre>Claude Code: ${esc(r.claude)}\nCodex:       ${esc(r.codex)}</pre></div>`; };
  const est = async () => { const v = k => $("#e-" + k).value;
    ["calls", "start", "end", "out", "breaks"].forEach(k => $("#v-" + k).textContent = v(k));
    const r = await getJSON(`/api/estimate?model=${encodeURIComponent(v("model"))}&calls=${v("calls")}&start=${v("start")}&end=${Math.max(+v("start"), +v("end"))}&out=${v("out")}&breaks=${v("breaks")}&ttl=${v("ttl")}`);
    const u = r.unit === "$" ? "$" : "cr", budget = st.data ? (u === "$" ? st.data.config.claude_budget_usd : st.data.config.codex_budget_credits) : 0, p = r.parts;
    const rows = [{label: "Cache reads", cost: p.read}, {label: "New tokens written", cost: p.write}, {label: "Rebuilds after breaks", cost: p.rebuild}, {label: "Output", cost: p.output}];
    $("#est").innerHTML = `<div class="tile" style="padding:0 0 8px"><div class="val">${money(r.total, u)}</div><div class="foot">${budget ? Math.floor(budget / (r.total || 1)) + " sessions like this per monthly budget" : ""}</div></div>${hbars(rows, r.total, u)}`; };
  ["check", "decided", "hard"].forEach(k => $("#q-" + k).onchange = lane);
  ["model", "ttl", "calls", "start", "end", "out", "breaks"].forEach(k => $("#e-" + k).oninput = est);
  lane(); est();
}

/* ------------------------------------------------------------------ theme */
function setTheme(t, keep) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("#theme button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
  if (keep) try { localStorage.setItem("tke-theme", t); } catch (e) {}
  if (st.data) render();
}
(() => { let t = new URLSearchParams(location.search).get("theme"); if (!t) try { t = localStorage.getItem("tke-theme"); } catch (e) {} setTheme(t || "auto"); })();
$("#theme").onclick = e => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.t, true); };

/* ------------------------------------------------------------------ routing + wiring */
function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  if (h[0] === "session" && h[2]) { st.view = "session"; st.sess = [h[1], decodeURIComponent(h[2])]; }
  else st.view = ["overview", "sessions", "causes", "subagents", "setup", "planner"].includes(h[0]) ? h[0] : "overview";
  if (st.data) render();
}
addEventListener("hashchange", route);
$("#f-tool").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.tool = b.dataset.k; st.project = ""; save(); if (st.view === "session") location.hash = "#/sessions"; load(); };
$("#f-period").onclick = e => { const b = e.target.closest("button"); if (!b) return; st.period = b.dataset.k; save(); load(); };
$("#f-project").onchange = e => { st.project = e.target.value; load(); };
$("#refresh").onclick = () => { st.sdata = null; load(true); };
app.addEventListener("click", e => { const tr = e.target.closest("tr[data-sid]"); if (tr) openSession(tr.dataset.tool, tr.dataset.sid); });
app.addEventListener("keydown", e => { const tr = e.target.closest("tr[data-sid]"); if (tr && e.key === "Enter") openSession(tr.dataset.tool, tr.dataset.sid); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (st.data && ["overview", "session", "causes"].includes(st.view)) render(); }, 200); });
route(); load();
</script>
