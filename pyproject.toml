[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-token-economy"
version = "0.2.0"
description = "Make an AI coding budget last the month: offline spend reports, settings and hooks for Claude Code and Codex."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.scripts]
tke = "token_economy.cli:main"

[tool.setuptools]
packages = ["token_economy"]

[tool.setuptools.package-data]
token_economy = ["templates/*", "web/*"]
